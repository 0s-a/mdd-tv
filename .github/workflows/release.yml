name: Cloud Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Silent Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Optimized Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          OUTPUT_APK="mdd-tv-${VERSION_TAG}.apk"
          
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "$OUTPUT_APK"
            echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
            echo "Successfully prepared: $OUTPUT_APK"
          else
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="/tmp/release_notes.md"
          
          python3 -c "
          import re, sys
          version = sys.argv[1]
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
              pattern = r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
              else:
                  notes = 'Release ' + version
              with open('/tmp/release_notes.md', 'w') as out:
                  out.write(notes)
          except Exception as e:
              with open('/tmp/release_notes.md', 'w') as out:
                  out.write('Release ' + version)
          " "$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "mdd TV ${{ github.ref_name }}"
          body_path: /tmp/release_notes.md
          files: ${{ steps.prepare_asset.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
