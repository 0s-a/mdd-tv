# JVM memory and GC settings tailored for low-spec / low-RAM Linux environments
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Enable caching and parallel execution to reduce build times and CPU thrashing
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android Gradle Plugin settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin build settings
kotlin.code.style=official
kotlin.incremental=true
